name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version ("1.2.3", "v1.2.3") or bump rule ("major"/"minor"/"patch")'
        required: false
        default: "minor"

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/resolve_version.py

      - name: Commit version bump and tag
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.resolve.outputs.version }}" || echo "No changes to commit"
          git push origin HEAD:master
          git tag "${{ steps.resolve.outputs.tag }}"
          git push origin "${{ steps.resolve.outputs.tag }}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build
        run: uv run python build.py --target ${{ matrix.target }} --name "QR Generator"

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos" ]; then
            (cd dist && ditto -c -k --keepParent "QR Generator.app" "QR-Generator-macos.zip")
          else
            mv "dist/QR Generator.exe" "dist/QR-Generator-windows.exe"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/QR-Generator-macos.zip
            dist/QR-Generator-windows.exe
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; deleting it to replace assets"
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes
